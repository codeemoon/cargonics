<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Website Signature Navy Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000520" />
      <stop offset="100%" stop-color="#162E74" />
    </linearGradient>
    
    <!-- Website Signature Orange Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe6b00" />
      <stop offset="100%" stop-color="#ff8c3b" />
    </linearGradient>

    <!-- Glowing Drop Shadow for premium look -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#fe6b00" flood-opacity="0.25" />
    </filter>

    <style>
      .text-logo {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-style: italic;
      }
    </style>
  </defs>
  
  <!-- Outer Background Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#bg)" />
  
  <!-- Inner Border accentuating premium design -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.1" />
  
  <!-- Express Shipping Motion Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <path d="M 60,180 L 160,180" />
    <path d="M 40,240 L 120,240" />
    <path d="M 70,300 L 180,300" />
  </g>
  
  <!-- Stylized Monogram Group -->
  <g transform="translate(-10, 0)">
    <!-- Monogram "CE" with signature brand colors -->
    <text x="215" y="256" class="text-logo" font-size="240" fill="#ffffff" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))">C</text>
    <text x="335" y="256" class="text-logo" font-size="240" fill="url(#accent)" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))">E</text>

    <!-- Fast-Forward Express Chevrons signifying speed and delivery -->
    <g transform="translate(405, 206) scale(0.9)" filter="url(#glow)">
      <path d="M 0,0 L 25,25 L 0,50" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 20,0 L 45,25 L 20,50" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>